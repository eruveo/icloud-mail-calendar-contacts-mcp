<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="330" fill="#ffffff" opacity="0.05"/>

  <!-- contact card (back, left) -->
  <g filter="url(#shadow)" transform="translate(-60 -10) rotate(-14 330 560)">
    <rect x="170" y="400" width="320" height="320" rx="44" fill="#e0f2fe"/>
    <circle cx="330" cy="525" r="62" fill="#0f766e"/>
    <path d="M222 680c14-62 58-96 108-96s94 34 108 96" fill="#0f766e"/>
  </g>

  <!-- calendar (back, right) -->
  <g filter="url(#shadow)" transform="translate(60 -10) rotate(14 694 560)">
    <rect x="534" y="400" width="320" height="320" rx="44" fill="#ffffff"/>
    <path d="M534 444a44 44 0 0 1 44-44h232a44 44 0 0 1 44 44v52H534z" fill="#ef4444"/>
    <rect x="606" y="372" width="22" height="64" rx="11" fill="#1e1b4b"/>
    <rect x="760" y="372" width="22" height="64" rx="11" fill="#1e1b4b"/>
    <g fill="#1e1b4b" opacity="0.85">
      <rect x="584" y="530" width="52" height="44" rx="10"/><rect x="668" y="530" width="52" height="44" rx="10"/><rect x="752" y="530" width="52" height="44" rx="10"/>
      <rect x="584" y="602" width="52" height="44" rx="10"/><rect x="668" y="602" width="52" height="44" rx="10" fill="#0f766e" opacity="1"/><rect x="752" y="602" width="52" height="44" rx="10"/>
    </g>
  </g>

  <!-- envelope (front, center) -->
  <g filter="url(#shadow)">
    <rect x="322" y="530" width="380" height="260" rx="44" fill="#ffffff"/>
    <path d="M348 560l164 120 164-120" fill="none" stroke="#0f766e" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- agent spark -->
  <g filter="url(#shadow)">
    <path d="M512 150c18 74 44 100 118 118-74 18-100 44-118 118-18-74-44-100-118-118 74-18 100-44 118-118z" fill="url(#spark)"/>
    <path d="M700 220c8 32 19 43 51 51-32 8-43 19-51 51-8-32-19-43-51-51 32-8 43-19 51-51z" fill="#fde68a"/>
  </g>
